name: trigger-compiti

# Solo un orologio: nessun codice, nessuna esecuzione vera. Alla cron giusta
# (ora italiana, DST gestito da GitHub) spara una workflow_dispatch al repo
# privato BoniniFilippoMaria/regRender, che e' quello che fa il lavoro.
# I log restano nel repo privato; qui non passa altro che l'argomento dello slot.
#
# Perché non la schedule dentro il repo privato: su repo privati con piano Free
# l'evento schedule ha la priorita' piu' bassa della coda condivisa e arriva con
# ore di ritardo o non arriva. Su un repo pubblico non succede.
#
# --ref main e' obbligatorio: gh cerca di leggere il default branch via GraphQL,
# che una PAT fine-grained non puo' leggere.

on:
  schedule:
    - cron: "7 14 * * 1-4"
      timezone: Europe/Rome
    - cron: "37 16 * * 1-4"
      timezone: Europe/Rome
    - cron: "7 17 * * 5"
      timezone: Europe/Rome
    - cron: "7 12 * * 0,6"
      timezone: Europe/Rome
  workflow_dispatch:
    inputs:
      args:
        description: "Argomenti per compiti.yml (default: lo slot del giorno)"
        required: false
        default: ""

concurrency:
  group: trigger-compiti
  cancel-in-progress: false

permissions: {}

jobs:
  spara:
    runs-on: ubuntu-latest
    steps:
      - name: Scegli lo slot
        id: slot
        shell: bash
        env:
          SCHED: ${{ github.event.schedule }}
          INPUT_ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          case "$SCHED" in
            "7 14 * * 1-4")  args="--send" ;;
            "37 16 * * 1-4") args="--send --second" ;;
            "7 17 * * 5")    args="--send --weekend" ;;
            "7 12 * * 0,6")  args="--send --weekend --second" ;;
            *)               args="" ;;
          esac
          if [ -n "$INPUT_ARGS" ]; then
            args="$INPUT_ARGS"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "schedule='$SCHED' -> args='$args'"

      - name: Avvia la run sul repo privato
        if: steps.slot.outputs.args != ''
        env:
          GH_TOKEN: ${{ secrets.REG_PAT }}
          ARGS: ${{ steps.slot.outputs.args }}
        run: |
          set -euo pipefail
          echo "dispatch con args: $ARGS"
          gh workflow run compiti.yml -R BoniniFilippoMaria/regRender --ref main -f args="$ARGS"
          echo "attendo 90 secondi per vedere l'esito..."
          sleep 90
          gh run list -R BoniniFilippoMaria/regRender --workflow compiti.yml --limit 1 \
            --json databaseId,status,conclusion,createdAt,url \
            --jq '.[0] | "run \(.databaseId)  \(.status)/\(.conclusion // "-")  \(.url)"'
          echo "azioni del repo privato: https://github.com/BoniniFilippoMaria/regRender/actions"