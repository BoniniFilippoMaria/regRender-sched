name: trigger-compiti
on:
  workflow_dispatch:
    inputs:
      args:
        description: 'Argomenti da passare a compiti.yml'
        required: false
        default: '--send'
permissions: {}
concurrency:
  group: trigger-compiti
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger compiti
        env:
          GH_TOKEN: ${{ secrets.REG_PAT }}
          ARGS: ${{ github.event.inputs.args }}
        run: |
          echo "Dispatching compiti.yml with args: $ARGS"
          gh workflow run compiti.yml \
            -R BoniniFilippoMaria/regRender \
            --ref main \
            -f args="$ARGS"
